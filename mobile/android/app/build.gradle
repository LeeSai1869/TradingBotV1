plugins { id 'com.android.application' }
android {
    namespace 'com.tradingindicator.alerts'
    compileSdk 36
    defaultConfig {
        applicationId project.findProperty('applicationId') ?: 'com.tradingindicator.alerts'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE_FILE')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_FILE'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release { if (System.getenv('ANDROID_KEYSTORE_FILE')) signingConfig signingConfigs.release }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.0.0')
    implementation 'com.google.firebase:firebase-messaging'
}
