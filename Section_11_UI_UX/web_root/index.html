<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Indicator — Chart</title>
    <link rel="stylesheet" href="/web_root/styles.css">
    <script src="https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>

<main id="login-screen">
    <section class="login-card" aria-labelledby="login-title">
        <h1 id="login-title">Trading Indicator</h1>
        <p class="login-subtitle">Sign in to your workspace</p>
        <p id="login-status" role="status" aria-live="polite">Connecting to the app server…</p>
        <div id="login-setup" hidden>
            <p>In your project terminal, run:</p>
            <code>python3 -m Section_11_UI_UX.server.auth</code>
            <p>Set separate passwords for <strong>admin</strong> and <strong>user</strong>. Passwords stay on your computer.</p>
        </div>
        <form id="login-form" hidden>
            <label>Username<input name="username" autocomplete="username" required></label>
            <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
            <label class="remember-me"><input name="remember" type="checkbox">Remember me for 30 days</label>
            <button type="submit">Sign in</button>
        </form>
        <button id="login-retry" hidden>Check again</button>
    </section>
</main>
<div id="app" hidden>
    <div id="toolbar">
        <label>Symbol</label>
        <select id="symbol"></select>

        <label>Timeframe</label>
        <select id="interval"></select>
        <span id="tf-buttons"></span>

        <button id="reload">Reload</button>
    </div>
    <div id="chart-workspace">
        <div id="chart"></div>
        <aside id="analysis-panel" aria-label="Analysis workspace" hidden></aside>
    </div>
    <div id="status" role="status">Loading...</div>
</div>

<!-- System -->
<script type="module" src="/chart/index.js"></script>
<script type="module" src="/web_root/data_cache.js"></script>
<script type="module" src="/web_root/composer.js"></script>
<script type="module" src="/web_root/app.js"></script>

</body>
</html>
