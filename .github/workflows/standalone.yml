name: Build standalone app
on:
  workflow_dispatch:
    inputs:
      python_version:
        description: Python version matching production memory
        default: "3.14"
        required: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
      - run: python -m pip install -r requirements-standalone.txt
      - run: python -m PyInstaller --clean --noconfirm packaging/TradingIndicator.spec
      - name: Smoke test frozen app
        run: python packaging/smoke.py
      - run: python packaging/archive.py
      - uses: actions/upload-artifact@v4
        with:
          name: TradingIndicator-${{ runner.os }}-${{ runner.arch }}
          path: dist/*.tar.gz
